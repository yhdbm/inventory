<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit strategies</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2933; --muted:#647382; --line:#e3e8ee;
            --accent:#2563eb; --green:#16a34a; --greenbg:#dcfce7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--ink); }
    header { background:#1f2933; color:#fff; padding:14px 24px; }
    header h1 { font-size:18px; margin:0; }
    .wrap { max-width:760px; margin:0 auto; padding:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:18px; }
    p.lead { color:var(--muted); font-size:13px; margin:0 0 14px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
    select { padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-size:14px;
             min-width:210px; }
    select.is-default { background: var(--greenbg); border-color:#86efac; }
    select.just-saved { outline: 3px solid #16a34a; transition: outline .2s; }
    #saved { font-weight:700; }
    .legend { font-size:12px; color:var(--muted); margin:10px 0 0; }
    .swatch { display:inline-block; width:12px; height:12px; border-radius:3px;
              background:var(--greenbg); border:1px solid #86efac; vertical-align:middle; margin-right:4px; }
    .actions { margin-top:16px; display:flex; gap:8px; align-items:center; }
    .btn { padding:9px 14px; border:0; border-radius:7px; background:var(--accent); color:#fff;
           font-size:13px; cursor:pointer; }
    .btn.ghost { background:#e2e8f0; color:var(--ink); }
    #saved { font-size:12px; color:var(--green); }
    .def-col { color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header><h1>⚙️ Field edit strategies</h1></header>
  <div class="wrap">
    <div class="card">
      <p class="lead">
        Choose how the extension sets each field in ServiceNow's inline list edit:
        <b>Dropdown</b> picks the matching option, <b>Text input</b> types the value.
        Cells with a <span class="swatch"></span> green background are using the
        hardcoded default.
      </p>

      <table>
        <thead><tr><th>Field</th><th>Strategy</th><th>Default</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>

      <p class="legend"><span class="swatch"></span> = default value</p>

      <div class="actions">
        <button class="btn ghost" id="reset">Roll back to defaults</button>
        <span id="saved"></span>
      </div>
    </div>
  </div>

  <script src="strategy-defaults.js"></script>
  <script src="strategies.js"></script>
</body>
</html>
